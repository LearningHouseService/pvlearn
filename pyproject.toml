[project]
name = "pvlearn"
dynamic = ["version"]
description = "Self-learning PV production forecast library and service — teach your home to predict its own solar production."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<4"
license = "MIT"
authors = [
    { name = "Johannes Ott", email = "info@johannes-ott.net" }
]
keywords = ["photovoltaic", "solar", "forecast", "machine learning", "home automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=2.4",
    "pandas>=2.2",
    "scikit-learn>=1.9",
    "scipy>=1.17",
    "pydantic>=2.13",
    "astral>=3.2",
]

[project.urls]
Homepage = "https://github.com/LearningHouseService/pvlearn"
Documentation = "https://github.com/LearningHouseService/pvlearn/blob/main/README.md"
Repository = "https://github.com/LearningHouseService/pvlearn"
Issues = "https://github.com/LearningHouseService/pvlearn/issues"

[project.optional-dependencies]
dev = [
    "setuptools-scm[toml]>=8",
    "ruff",
    "tomli",
    "pyright",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    # Reading the Parquet reference fixture. The library itself takes DataFrames
    # from its caller and never touches Parquet, so this stays a test dependency.
    "pyarrow>=18",
]
service = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "pyjwt>=2.13",
]

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "setuptools-scm[toml]>=8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pvlearn*"]
exclude = ["tests*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -n auto --dist=worksteal"
markers = [
    "slow"
]

[tool.coverage.run]
source = ["pvlearn"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
