name: build-project

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: main
  release:
    types: [published]

jobs:
  variables:
    outputs:
      ref_name: ${{ steps.var.outputs.ref_name }}
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Setting global variables
        uses: actions/github-script@v9
        id: var
        with:
          script: |
            const refName = '${{ github.ref_name || github.event.release.tag_name }}';
            core.setOutput('ref_name', refName.toLowerCase().replaceAll(/[/.]/g, '-').replace(/^-+|-+$/g, ''));

  build-check:
    runs-on: ubuntu-latest
    needs: [variables]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            !~/.cache/pip/log
          key: ${{ runner.os }}-python-3.13-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.13-pip-
            ${{ runner.os }}-python-3.13-
            ${{ runner.os }}-python-
            ${{ runner.os }}-pip-

      - name: Install build package
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,service]"

      - name: Get changed Python files
        id: changed-py-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD" -- '*.py' | tr '\n' ' ')
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMRT "${{ github.event.before }}" "${{ github.sha }}" -- '*.py' | tr '\n' ' ')
          fi
          echo "files=$(echo "$FILES" | xargs)" >> $GITHUB_OUTPUT

      - name: Lint with ruff
        run: |
          FILES="${{ steps.changed-py-files.outputs.files }}"
          ruff check ${FILES:-.}

      - name: Type check with pyright
        run: |
          FILES="${{ steps.changed-py-files.outputs.files }}"
          if [ -z "$FILES" ]; then
            pyright
          else
            pyright $FILES
          fi

      - name: Run tests with coverage
        run: python -m pytest --cov=pvlearn --cov-report=xml:coverage.xml --tb=short

      - name: Build package
        run: python -m build

      - name: Save python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-artifacts-3.13-${{ env.REF_NAME }}
          path: |
            dist

  # Publishing is isolated in its own release-only job so that the elevated
  # permissions it needs are never granted to the job that runs tests and builds.
  publish:
    runs-on: ubuntu-latest
    needs: [variables, build-check, build-compat]
    if: ${{ github.event_name == 'release' }}
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download python artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-artifacts-3.13-${{ env.REF_NAME }}
          path: dist

      - name: Publish package to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish assets to github
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: dist/*
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
          file_glob: true

  build-compat:
    runs-on: ubuntu-latest
    needs: [variables, build-check]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    permissions:
      contents: read
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            !~/.cache/pip/log
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-
            ${{ runner.os }}-python-${{ matrix.python-version }}-
            ${{ runner.os }}-python-
            ${{ runner.os }}-pip-

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service]"

      - name: Run tests
        run: python -m pytest --tb=short
